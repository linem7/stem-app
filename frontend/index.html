<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover 是为了 env(safe-area-inset-*) 能拿到真值（iPhone 底部那条横杠）。
      **不写 maximum-scale / user-scalable=no**：视力不好的老师会自己双指放大，
      封掉缩放等于把「字号三档可调」之外的最后一条路也堵死。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF8" />
    <title>写教案</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
